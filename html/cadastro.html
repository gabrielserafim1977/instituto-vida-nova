<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Instituto Vida Nova</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imagens/faviconsite.png">
</head>

<body>

    <header>

        <h1>Instituto Vida Nova</h1>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            ☰
        </label>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja Voluntário</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>


    <main>

        <section>

            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha seus dados abaixo para participar das ações
                do Instituto Vida Nova.
            </p>


            <form id="formCadastro">

                <fieldset>

                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome completo:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required>


                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required>


                    <label for="cpf">CPF:</label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Contato</legend>

                    <label for="email">E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>


                    <label for="telefone">Telefone:</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(88) 99999-9999"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="\d{5}-\d{3}"
                        required>


                    <label for="endereco">Endereço:</label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required>


                    <label for="cidade">Cidade:</label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required>


                    <label for="estado">Estado:</label>

                    <select
                        id="estado"
                        name="estado"
                        required>

                        <option value="">Selecione</option>

                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>

                    </select>

                </fieldset>


                <fieldset>

                    <legend>Participação</legend>

                    <label for="participacao">
                        Como deseja ajudar?
                    </label>

                    <select
                        id="participacao"
                        name="participacao"
                        required>

                        <option value="">Selecione</option>

                        <option value="voluntario">
                            Quero ser voluntário
                        </option>

                        <option value="doador">
                            Quero fazer doações
                        </option>

                        <option value="ambos">
                            Quero ser voluntário e doador
                        </option>

                    </select>

                </fieldset>


                <button type="submit">
                    Enviar Cadastro
                </button>

            </form>

            <div id="mensagem-feedback"></div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Instituto Vida Nova -
            Todos os direitos reservados.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
